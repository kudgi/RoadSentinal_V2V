<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Road Sentinel — V2V Safety Simulation</title>
  <link rel="stylesheet" href="final.css">
</head>
<body>
  <main id="hud">
    <header>
      <div class="brand"><strong>ROAD SENTINEL</strong><small>SUMO · ECLIPSE MOSAIC · THREE.JS</small></div>
      <span id="status">INITIALIZING DIGITAL TWIN</span>
      <button id="quality" type="button">BALANCED</button>
    </header>
    <section id="alert">
      <small>COOPERATIVE SAFETY EVENT</small>
      <h1 id="alertTitle">ROAD NETWORK NOMINAL</h1>
      <p id="detail">Monitoring verified MOSAIC telemetry.</p>
      <div class="risk-row"><span id="riskBadge">MONITORING</span><span>TTC <b id="ttc">—</b></span></div>
    </section>
    <aside>
      <small>LIVE TELEMETRY</small>
      <div class="grid">
        <label><b id="vehicles">0</b>VEHICLES</label><label><b id="rx">0</b>DENM RX</label>
        <label><b id="tx">0</b>DENM TX</label><label><b id="time">0.0s</b>SIM TIME</label>
      </div>
      <p>MAP <b id="map">LOADING</b></p><p>DATA <b id="data">LOADING</b></p><p>SOURCE <b id="source">CONNECTING</b></p>
    </aside>
    <div id="legend"><span><i class="tx"></i>DENM TX</span><span><i class="rx"></i>DENM RX</span><span><i class="range"></i>500 m range</span></div>
    <footer>
      <button id="play" type="button">▶ PLAY</button><button id="pause" type="button">Ⅱ PAUSE</button><button id="reset" type="button">↺ RESET</button>
      <button id="cameraMode" type="button">◉ AUTO CAMERA</button>
      <label>SPEED <input id="speed" type="range" min=".25" max="10" step=".25" value="3"><output id="speedValue">3×</output></label>
      <span>Drag to orbit · wheel to zoom</span>
    </footer>
  </main>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <script type="module" src="final.js"></script>
</body>
</html>
